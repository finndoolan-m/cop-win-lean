# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json

version: "v0.4"

project:
  name: "Dismantlable graphs are cop-win (Nowakowski-Winkler), and trees have cop number 1"
  description: >-
    A machine-checked proof of the Nowakowski-Winkler theorem in the game of cops and robbers: on
    a finite dismantlable graph, one cop can always catch the robber. A vertex u is a corner if
    some other vertex w has N[u] contained in N[w] (closed neighbourhoods), and a graph is
    dismantlable if corners can be deleted one at a time until one vertex is left. The proof
    defines a one-cop game played inside a vertex set, with a bridge lemma showing that on the
    whole vertex set it is exactly Formal Conjectures' game CopsCatchWithin with one cop. A
    general shadow-map lemma says that if f maps S into T, sends legal moves to legal moves, and
    a cop on f x can reach every vertex the robber can step to from x, then a cop that wins on T
    also wins on S, by chasing the robber's shadow f r. Folding a corner onto the vertex that
    covers it is such a map, so induction on dismantlability gives the theorem. As a corollary,
    every finite nonempty tree is dismantlable (each leaf is a corner covered by its neighbour)
    and so has cop number 1. This is the statement meyniel_conjecture.variants.tree of Formal
    Conjectures, which marks it research solved. The mathematics is classical and no mathematical
    priority is claimed; to our knowledge this is the first published Lean 4 formalisation.
  authors:
    - "Finn Doolan"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Finn Doolan"

sources:
  - title: "Vertex-to-vertex pursuit in a graph"
    authors:
      - "Richard Nowakowski"
      - "Peter Winkler"
    id: "https://doi.org/10.1016/0012-365X(83)90160-7"
    type: "paper"
    location: >-
      Discrete Math. 43 (1983), 235-239. The characterisation of cop-win graphs as dismantlable
      graphs; this entry formalises the direction dismantlable implies cop-win.
    relationship: "formalizes"
    author_endorsement: "n/a"
  - title: "Cop number"
    authors:
      - "Wikipedia contributors"
    id: "https://en.wikipedia.org/wiki/Cop_number"
    type: "web discussion"
    location: "Background on the game, cop-win graphs and Meyniel's conjecture."
    relationship: "background"
    author_endorsement: "n/a"

related_formalizations:
  - id: "https://github.com/google-deepmind/formal-conjectures/blob/2207c54d0dbe960de591d280f997b195bf3f6e28/FormalConjectures/Wikipedia/MeynielConjecture.lean"
    relationship: "builds-on"
    note: >-
      Supplies the statement. Challenge.lean copies meyniel_conjecture.variants.tree and the
      definitions it uses (Step, CopsCatchWithin, CopsWin, copNumber) with attributes removed and
      Mathlib imported in place of Formal Conjectures' library. CopWin/Defs.lean repeats the same
      definitions unchanged, and CopWin/Game.lean reuses the proofs of three API lemmas from that
      file.

classification:
  arxiv:
    - "math.CO"
  msc2020:
    - "05C57"
    - "91A43"
    - "05C05"

automation:
  methods:
    - method: "agent"
      models:
        - "Claude Opus 5.5"
      framework: "Claude Code"
  notes: >-
    I chose the problem and made the formalisation design decisions: a separate one-cop game with
    a bridge lemma to Formal Conjectures' definition, a general shadow-map lemma for the shadow
    strategy, and dismantlability as an inductive predicate on vertex sets. Claude Code drafted
    all of the Lean code and ran the searches for existing formalizations.

review:
  status: "self-assessed"
  notes: >-
    Checked locally (Linux): the build, and audit/Axioms.lean, which enforces with #guard_msgs that
    the main results use only propext, Classical.choice and Quot.sound. The copied definitions and
    statement were compared textually with Formal Conjectures at the pinned commit.

status:
  scope: >-
    The direction of the Nowakowski-Winkler theorem saying dismantlable finite graphs have cop
    number 1, stated and checked in Challenge.lean, and as a corollary a full proof of the Formal
    Conjectures statement meyniel_conjecture.variants.tree. The converse (cop-win
    implies dismantlable) is not formalised. The only sorry is the placeholder in Challenge.lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - description: >-
        Nowakowski-Winkler: a finite nonempty graph whose vertex set is dismantlable has cop
        number 1.
      declaration: "CopWin.Dismantlable.copNumber_eq_one"
      file: "CopWin/Dismantlable.lean"
      comparator_config: "comparator.json"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
    - description: >-
        Corollary: every finite nonempty connected acyclic graph has cop number 1.
      declaration: "MeynielConjecture.meyniel_conjecture.variants.tree"
      file: "Solution.lean"
      comparator_config: "comparator.json"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"

fidelity:
  divergences: >-
    None in the tree statement: Challenge.lean is Formal Conjectures' text with its attributes
    removed, under Formal Conjectures' names. Challenge.lean also states the Nowakowski-Winkler
    theorem, with IsCorner and Dismantlable copied unchanged from CopWin/Dismantlable.lean, so the
    comparator checks it against the same game definitions. Challenge imports Mathlib rather than FormalConjecturesUtil and
    builds with Lean v4.35.0-rc3 rather than Formal Conjectures' v4.33.1 (Palomar's minimum). The
    same proof was first checked with Formal Conjectures' Lean v4.33.1 and Mathlib, unchanged.
    The dismantlability notion is defined on vertex subsets of a fixed graph (delete a corner of
    the induced subgraph on S), which is the usual definition.

alignment:
  namespaces:
    - "MeynielConjecture"
    - "CopWin"
  statements:
    - source: "Formal Conjectures, meyniel_conjecture.variants.tree"
      lean: "MeynielConjecture.meyniel_conjecture.variants.tree"
      module: "Solution"
      status: "proved"
    - source: "Nowakowski-Winkler (1983), dismantlable graphs are cop-win"
      lean: "CopWin.Dismantlable.copNumber_eq_one"
      module: "Solution"
      status: "proved"

acknowledgements: >-
  Thanks to the authors of Lean 4, Mathlib and Formal Conjectures.
